<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informador de Manises · APM-Compromís</title>
<meta name="description" content="Agent d'IA que resol dubtes sobre l'APM-Compromís de Manises i l'actualitat municipal. Multilingüe, amb veu i lletra ampliable.">
<meta name="theme-color" content="#ff6b35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Informador Manises">
<link rel="stylesheet" href="styles.css">
<base target="_blank">
</head>
<body>

<header class="cap">
  <img class="logo" src="image1.jpg" alt="Rajola ceràmica de Manises, logotip de l'Informador">
  <div class="titols">
    <h1>Informador de Manises</h1>
    <p class="subtitol">APM-Compromís · Manises</p>
    <p class="lema" id="lema"></p>
  </div>
</header>

<nav class="barra" aria-label="Opcions d'accessibilitat i idioma">
  <div class="grup" role="group" aria-label="Mida de lletra">
    <button id="lletra-menys" class="boto eina" title="Reduir la mida de la lletra" aria-label="Reduir la mida de la lletra">A−</button>
    <button id="lletra-reset" class="boto eina" title="Mida de lletra normal" aria-label="Mida de lletra normal">A</button>
    <button id="lletra-mes" class="boto eina" title="Augmentar la mida de la lletra" aria-label="Augmentar la mida de la lletra">A+</button>
  </div>
  <label class="seleccio-idioma">
    <span class="sr-only">Llengua</span>
    <select id="idioma" aria-label="Tria la llengua de la conversa"></select>
  </label>
  <button id="veu" class="boto eina" title="Activar o desactivar la veu" aria-label="Activar o desactivar la veu">🔊</button>
  <button id="instalar" class="boto or" hidden>📱 <span id="instalar-text">Instal·lar app</span></button>
</nav>

<main>
  <section id="xat" class="xat" aria-live="polite" aria-label="Conversa amb l'Informador"></section>

  <form id="formulari" class="formulari" autocomplete="off">
    <button type="button" id="micro" class="boto eina gran" title="Parla" aria-label="Dictar la pregunta amb veu">🎙️</button>
    <input id="entrada" type="text" required
           placeholder="Escriu la teua pregunta…"
           aria-label="Escriu la teua pregunta">
    <button type="submit" id="enviar" class="boto gran" title="Envia" aria-label="Envia la pregunta">➤</button>
  </form>
  <p id="estat" class="estat" role="status"></p>
</main>

<footer class="peu">
  <img class="marca-inferior" src="image2.jpg" alt="APM-Compromís Manises · Plaça del Castell, 1 · manises@compromis.net">
  <p class="avis-email"><span id="avis-pre"></span> <a id="avis-enllac" href="mailto:manises@compromis.net"></a></p>
  <p>APM-Compromís Manises · Observatori d'Igualtat Educativa, 2026</p>
</footer>

<script src="app.js" defer></script>
</body>
</html>
